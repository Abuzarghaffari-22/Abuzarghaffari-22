<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Plan, Data, Model, Train, Evaluate, Integrate, Deploy, Monitor">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .lbl { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
      .num { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
    </style>
    <linearGradient id="trackGradL" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0">
      <stop offset="0%" stop-color="#008FCC" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#5B5BD6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#008FCC" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="nodeGlowL" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="trackPathL" d="M90,70 L1110,70"/>
  </defs>

  <line x1="90" y1="70" x2="1110" y2="70" stroke="url(#trackGradL)" stroke-width="1.5"/>

  <circle r="5" fill="#008FCC">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#trackPathL" xlink:href="#trackPathL"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g class="lbl" font-size="12.5" letter-spacing="1.5" fill="#172033" text-anchor="middle">
    <circle cx="90" cy="70" r="10" fill="#008FCC" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="70" r="5" fill="#FFFFFF" stroke="#008FCC" stroke-width="2"/>
    <text class="num" x="90" y="45" font-size="10.5" fill="#667085">01</text>
    <text x="90" y="105">PLAN</text>

    <circle cx="236" cy="70" r="10" fill="#1E93C9" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="236" cy="70" r="5" fill="#FFFFFF" stroke="#1E93C9" stroke-width="2"/>
    <text class="num" x="236" y="45" font-size="10.5" fill="#667085">02</text>
    <text x="236" y="105">DATA</text>

    <circle cx="381" cy="70" r="10" fill="#3497C6" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="381" cy="70" r="5" fill="#FFFFFF" stroke="#3497C6" stroke-width="2"/>
    <text class="num" x="381" y="45" font-size="10.5" fill="#667085">03</text>
    <text x="381" y="105">MODEL</text>

    <circle cx="527" cy="70" r="10" fill="#499BC3" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="527" cy="70" r="5" fill="#FFFFFF" stroke="#499BC3" stroke-width="2"/>
    <text class="num" x="527" y="45" font-size="10.5" fill="#667085">04</text>
    <text x="527" y="105">TRAIN</text>

    <circle cx="673" cy="70" r="10" fill="#5E9FC0" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="673" cy="70" r="5" fill="#FFFFFF" stroke="#5E9FC0" stroke-width="2"/>
    <text class="num" x="673" y="45" font-size="10.5" fill="#667085">05</text>
    <text x="673" y="105">EVALUATE</text>

    <circle cx="819" cy="70" r="10" fill="#73A3BD" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="819" cy="70" r="5" fill="#FFFFFF" stroke="#73A3BD" stroke-width="2"/>
    <text class="num" x="819" y="45" font-size="10.5" fill="#667085">06</text>
    <text x="819" y="105">INTEGRATE</text>

    <circle cx="964" cy="70" r="10" fill="#6A87CC" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="964" cy="70" r="5" fill="#FFFFFF" stroke="#6A87CC" stroke-width="2"/>
    <text class="num" x="964" y="45" font-size="10.5" fill="#667085">07</text>
    <text x="964" y="105">DEPLOY</text>

    <circle cx="1110" cy="70" r="10" fill="#5B5BD6" opacity="0.12" filter="url(#nodeGlowL)"><animate attributeName="opacity" values="0.06;0.20;0.06" dur="3s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="70" r="5" fill="#FFFFFF" stroke="#5B5BD6" stroke-width="2"/>
    <text class="num" x="1110" y="45" font-size="10.5" fill="#667085">08</text>
    <text x="1110" y="105">MONITOR</text>
  </g>
</svg>
