<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abuzar Ghaffari, AI Engineer">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .name { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-weight: 700; }
      .role { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
      .eyebrow { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
    </style>

    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F8FB"/>
      <stop offset="60%" stop-color="#F2F5F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="edgeFadeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="10%" stop-color="#000" stop-opacity="1"/>
      <stop offset="90%" stop-color="#000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMaskL">
      <rect x="0" y="0" width="1200" height="300" fill="url(#edgeFadeL)"/>
    </mask>

    <radialGradient id="glowBlueL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008FCC" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#008FCC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigoL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B5BD6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5B5BD6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ruleGradL" gradientUnits="userSpaceOnUse" x1="86" y1="0" x2="270" y2="0">
      <stop offset="0%" stop-color="#008FCC"/>
      <stop offset="100%" stop-color="#5B5BD6"/>
    </linearGradient>
  </defs>

  <g mask="url(#fadeMaskL)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bgGradL)"/>
    <circle cx="970" cy="70" r="230" fill="url(#glowBlueL)"/>
    <circle cx="150" cy="270" r="200" fill="url(#glowIndigoL)"/>

    <g stroke="#008FCC" stroke-opacity="0.18" stroke-width="1">
      <line x1="760" y1="60" x2="860" y2="95"/>
      <line x1="860" y1="95" x2="945" y2="55"/>
      <line x1="860" y1="95" x2="915" y2="165"/>
      <line x1="915" y1="165" x2="1020" y2="150"/>
      <line x1="1020" y1="150" x2="1080" y2="80"/>
      <line x1="1020" y1="150" x2="1095" y2="215"/>
      <line x1="915" y1="165" x2="835" y2="225"/>
    </g>
    <g fill="#008FCC">
      <circle cx="760" cy="60" r="3" opacity="0.55"/>
      <circle cx="860" cy="95" r="3.6" opacity="0.65"/>
      <circle cx="945" cy="55" r="2.6" opacity="0.45"/>
      <circle cx="915" cy="165" r="3.6" opacity="0.65"/>
      <circle cx="1020" cy="150" r="4" opacity="0.7"/>
      <circle cx="1080" cy="80" r="2.6" opacity="0.45"/>
      <circle cx="1095" cy="215" r="2.6" opacity="0.4"/>
      <circle cx="835" cy="225" r="2.6" opacity="0.4"/>
    </g>
    <g fill="#5B5BD6">
      <circle cx="1020" cy="150" r="4">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="86" y="76" class="eyebrow" font-size="13" letter-spacing="3" fill="#667085">AI SYSTEMS &#183; COMPUTER VISION &#183; GENERATIVE AI</text>

    <text x="84" y="168" class="name" font-size="62" fill="#172033">ABUZAR GHAFFARI</text>

    <text x="86" y="206" class="role" font-size="21" letter-spacing="6" fill="#008FCC">AI ENGINEER</text>

    <line x1="86" y1="230" x2="270" y2="230" stroke="url(#ruleGradL)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
